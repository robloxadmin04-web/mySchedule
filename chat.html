<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Coursework</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="friends.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand" id="brand">
      <span class="brand-mark" id="brand-mark">C</span>
      <span class="brand-name" id="brand-name">Coursework</span>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" href="index.html"><span class="nav-ico" data-ico="grid"></span>Dashboard</a>
      <a class="nav-item active" href="chat.html"><span class="nav-ico" data-ico="user"></span>Chat</a>
    </nav>
  </aside>

  <main class="main">
    <div class="view active" id="view-friends" style="padding:20px;">

      <div id="friends-auth">
        <h2>Sign in to chat with friends</h2>
        <button class="btn btn-primary" id="google-signin-btn">
          <span class="google-ico" aria-hidden="true"></span>
          Sign in with Google
        </button>
      </div>

      <div id="friends-app" class="hidden">
        <button class="btn btn-ghost btn-sm" id="friends-signout-btn">Sign Out</button>

        <h3>Add a Friend</h3>
        <input type="text" id="friend-search-input" placeholder="Search username...">
        <button class="btn btn-primary btn-sm" id="friend-search-btn">Search</button>
        <div id="friend-search-results"></div>

        <h3>Friend Requests</h3>
        <div id="friend-requests-list"></div>

        <h3>Your Friends</h3>
        <div id="friends-list"></div>

        <div id="chat-panel" class="hidden">
          <div class="chat-header">
            <span id="chat-with-name"></span>
            <button class="btn btn-ghost btn-sm" id="chat-close-btn">Close</button>
          </div>
          <div id="chat-log" class="chat-log"></div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button class="btn btn-primary" id="chat-send-btn">Send</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="chat.js"></script>
</body>
</html>
